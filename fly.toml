app = "gulpyvc-signal"
primary_region = "fra"

[build]
  [build.args]

[env]
  PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
